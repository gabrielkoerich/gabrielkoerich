{# Posts straight to the Brevo form, so it works without its embed script #}
{% if config.extra.newsletter_action %}
<form class="subscribe" action="{{ config.extra.newsletter_action }}" method="post">
    <label for="subscribe-email">{{ trans(key="subscribe_text", lang=lang) }} (<a href="{{ get_url(path='atom.xml') }}">{{ trans(key="subscribe_rss", lang=lang) }}</a>)</label>
    <div class="subscribe-row">
        <input id="subscribe-email" type="email" name="EMAIL" placeholder="Your email" autocomplete="email" required>
        <input class="subscribe-trap" type="text" name="email_address_check" value="" tabindex="-1" autocomplete="off" aria-hidden="true">
        <input type="hidden" name="locale" value="en">
        <button type="submit">{{ trans(key="subscribe_button", lang=lang) }}</button>
    </div>
    <p class="subscribe-status" role="status" hidden></p>
    <script>
        // Brevo answers with JSON, so send in the background instead of leaving the page on it
        document.querySelector(".subscribe").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = event.target;
            const status = form.querySelector(".subscribe-status");
            const button = form.querySelector("button");
            button.disabled = true;

            try {
                const response = await fetch(form.action, { method: "POST", body: new FormData(form) });
                const result = await response.json();
                if (!result.success) {
                    throw new Error("rejected");
                }

                status.textContent = {{ trans(key='subscribe_done', lang=lang) | json_encode | safe }};
                form.querySelector(".subscribe-row").hidden = true;
            } catch {
                status.textContent = {{ trans(key='subscribe_error', lang=lang) | json_encode | safe }};
                button.disabled = false;
            }

            status.hidden = false;
        });
    </script>
</form>
{% endif %}
