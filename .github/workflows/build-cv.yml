name: Build CV PDF

on:
  push:
    branches:
      - main
    paths:
      - content/cv.md
      - content/cv-summary.md
      - justfile

jobs:
  build:
    runs-on: ubuntu-latest
    # Commits the PDFs back to main
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install Pandoc & XeLaTeX
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc texlive-xetex texlive-fonts-recommended lmodern

      # Same recipe as local builds, so the published PDF matches what `just build-cv` shows
      - name: Build CV PDFs
        run: just build-cv

      # act sets ACT, so a local run never pushes
      - name: Commit & Push changes
        if: ${{ !env.ACT }}
        run: |
          git add static/gabrielkoerich-cv.pdf static/gabrielkoerich-cv-summary.pdf
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update CV PDF"
            git push
          fi
