name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Pushes made with GITHUB_TOKEN do not trigger workflows, so redeploy after the CV PDF commit
  workflow_run:
    workflows: ["Build CV PDF"]
    types: [completed]
  schedule:
    # Daily so scheduled posts go live on their date
    - cron: '7 9 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/gh-pages'
    # Commits new post cards back to main
    permissions:
      contents: write
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install requests pillow
          # pip install feedparser
          # sudo apt-get update
          # sudo apt-get install -y translate-shell

      # - name: Fetch blog posts
      #   run: |
      #     python3 scripts/fetch-blog-posts.py --medium-only  --output content/posts/external || echo "Blog fetch failed, continuing..."

      # - name: Translate blog posts to English
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     set +e
      #     python3 scripts/translate-blog-posts.py \
      #       --input-dir content/posts/external \
      #       --source-lang pt \
      #       --target-lang en \
      #       --provider command \
      #       --translator-cmd "trans -b -s {source_lang} -t {target_lang}"
      #     STATUS=$?
      #     set -e

      #     if [ "$STATUS" -ne 0 ]; then
      #       echo "translate-shell failed; trying OpenAI fallback..."
      #       if [ -n "$OPENAI_API_KEY" ]; then
      #         python3 scripts/translate-blog-posts.py \
      #           --input-dir content/posts/external \
      #           --source-lang pt \
      #           --target-lang en \
      #           --provider openai
      #       else
      #         echo "No OPENAI_API_KEY available; continuing without translation fallback."
      #       fi
      #     fi

      - name: Install Zola
        run: |
          wget -qO- https://github.com/getzola/zola/releases/download/v0.18.0/zola-v0.18.0-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C /usr/local/bin

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch-github.py

      - name: Generate US economic events calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 scripts/fetch-econ-events.py || echo "Econ events generation failed, continuing..."

      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this commit cannot loop
      - name: Draw and commit post cards
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python3 scripts/build-og-cards.py
          git add static/images/og
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit -m "Draw post cards"
            git push
          fi

      - name: Build site
        run: zola build

      - name: Generate llms.txt
        run: python3 scripts/build-llms-txt.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::warning::CF_API_TOKEN is not set, Cloudflare cache was not purged"
            exit 0
          fi
          response=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/b4f279fbdc18c1d62d60751dcefbc03e/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          echo "$response" | grep -q '"success":true' || echo "::warning::Cloudflare cache purge failed"

      - name: Checkout for IndexNow
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            static
            scripts

      # Tells Bing and other IndexNow engines about pages changed today, Google does not use IndexNow
      - name: Submit changed URLs to IndexNow
        continue-on-error: true
        run: python3 scripts/indexnow.py
