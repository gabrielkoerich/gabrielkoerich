name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/gh-pages'
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install requests feedparser
          sudo apt-get update
          sudo apt-get install -y translate-shell

      - name: Fetch blog posts
        run: |
          python3 scripts/fetch-blog-posts.py --medium-only  --output content/posts/external || echo "Blog fetch failed, continuing..."

      - name: Translate blog posts to English
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set +e
          python3 scripts/translate-blog-posts.py \
            --input-dir content/posts/external \
            --source-lang pt \
            --target-lang en \
            --provider command \
            --translator-cmd "trans -b -s {source_lang} -t {target_lang}"
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "translate-shell failed; trying OpenAI fallback..."
            if [ -n "$OPENAI_API_KEY" ]; then
              python3 scripts/translate-blog-posts.py \
                --input-dir content/posts/external \
                --source-lang pt \
                --target-lang en \
                --provider openai
            else
              echo "No OPENAI_API_KEY available; continuing without translation fallback."
            fi
          fi

      - name: Install Zola
        run: |
          wget -qO- https://github.com/getzola/zola/releases/download/v0.18.0/zola-v0.18.0-x86_64-unknown-linux-gnu.tar.gz | tar -xzf - -C /usr/local/bin

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/fetch-github.py

      - name: Generate US economic events calendar
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python3 scripts/fetch-econ-events.py || echo "Econ events generation failed, continuing..."

      - name: Build site
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare Cache
        continue-on-error: true
        run: |
          curl -X POST "https://api.cloudflare.com/client/v4/zones/b4f279fbdc18c1d62d60751dcefbc03e/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
