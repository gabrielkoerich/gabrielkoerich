# The URL the site will be built for
base_url = "https://gabrielkoerich.com"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# No template uses a search index, and it would publish scheduled posts early
build_search_index = false

# The site title and description
title = "Gabriel Koerich"
description = "Senior software engineer (15+ years). Solana/Rust DeFi, AI agent orchestration, and engineering workflow automation. Available for AI consulting."

# The default language
default_language = "en"

# When set to "true", the generated HTML files are minified
minify_html = true

# The taxonomies to be rendered for the site
taxonomies = [{ name = "tags" }]

[markdown]
# Open external links in a new tab
external_links_target_blank = true
# Emit z- classes, the palette lives in main.scss like the zola-docs theme
highlight_code = true
highlight_theme = "css"

[extra]
# Put all your custom variables here
author = "Gabriel Koerich"
tagline = "Senior Engineer · AI Workflows · Solana / DeFi"
linkedin = "https://linkedin.com/in/gabrielkoerich"
github = "https://github.com/gabrielkoerich"
email = "gabriel@gabrielkoerich.com"
og_image = "/og-image.png"
booking_url = "https://calendar.google.com/calendar/u/0/appointments/schedules/AcZssZ0XOx4YybKnmnkqQXsaLp7zPI_C2fkaxfrYY29KgNYPJpiK1LDbXF_zY7BIHJK02bGOdA3YJb7p?gv=true"
available_for_consulting = true
# Repos to hide from the homepage pinned list (e.g. archived/superseded projects)
hidden_repos = []

# Comments, the embed stays hidden until category_id is filled in
[extra.giscus]
