[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = { version = "=0.11.2", default-features = false }

[target.'cfg(target_arch = "bpf")'.dependencies]
solana-compiler-builtins = "=0.1.0"

[dev-dependencies]
mollusk-svm = "0.16.0"
solana-account = "4"
solana-pubkey = "4"
solana-instruction = "4.0.0"

[profile.release]
overflow-checks = true
codegen-units = 1
