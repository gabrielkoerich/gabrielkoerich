<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.5">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- accent corner -->
  <rect x="0" y="0" width="6" height="630" fill="#58a6ff"/>

  <!-- eyebrow -->
  <text x="80" y="155" font-family="SF Mono, Monaco, monospace" font-size="22"
        fill="#58a6ff" letter-spacing="3">GABRIELKOERICH.COM</text>

  <!-- name -->
  <text x="80" y="240" font-family="Inter, -apple-system, sans-serif"
        font-size="74" font-weight="700" fill="#e6edf3">Gabriel Koerich</text>

  <!-- title / tagline -->
  <text x="80" y="320" font-family="Inter, -apple-system, sans-serif"
        font-size="36" font-weight="400" fill="#8b949e">Senior Software Engineer · 17 years</text>

  <!-- value prop -->
  <text x="80" y="420" font-family="Inter, -apple-system, sans-serif"
        font-size="40" font-weight="600" fill="#e6edf3">Solana DeFi · AI agent orchestration</text>
  <text x="80" y="475" font-family="Inter, -apple-system, sans-serif"
        font-size="40" font-weight="600" fill="#e6edf3">Engineering workflow automation</text>

  <!-- bottom badge -->
  <g transform="translate(80, 540)">
    <circle cx="9" cy="9" r="7" fill="#3fb950"/>
    <text x="28" y="15" font-family="Inter, -apple-system, sans-serif"
          font-size="22" font-weight="500" fill="#8b949e">Available for AI consulting</text>
  </g>

  <!-- right-side mark -->
  <g transform="translate(1000, 250)">
    <rect x="0" y="0" width="140" height="140" rx="20" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="70" y="70" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, -apple-system, sans-serif"
          font-weight="700" font-size="72" fill="#58a6ff">gk</text>
  </g>
</svg>
